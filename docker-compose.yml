services:
  music-mcp:
    build: .
    container_name: music-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
